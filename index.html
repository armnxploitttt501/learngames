<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kata Kilat - Belajar Nama Hewan dan Buah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <button id="sound" class="sound" aria-pressed="true">Suara: nyala</button>

    <!-- MENU -->
    <section id="menu" class="screen active">
      <div class="mascot-slot big" data-mascot></div>
      <h1 class="logo">Kata Kilat</h1>
      <p class="lead">Kenalan sama nama hewan dan buah dalam bahasa Inggris, yuk! Pilih dulu yang mau dipelajari:</p>

      <div class="chips" id="chips">
        <button class="chip" data-cat="animals">🐘 Hewan</button>
        <button class="chip" data-cat="fruits">🍓 Buah</button>
        <button class="chip" data-cat="mixed">🎉 Campur</button>
      </div>

      <div class="modes">
        <button class="mode" data-mode="quiz">
          <span class="mode-name">🔍 Tebak Gambar</span>
          <span class="mode-desc">Lihat gambarnya, pilih nama Inggrisnya.</span>
          <span class="mode-best">Bintang terbanyak: <b id="best-quiz">0</b></span>
        </button>
        <button class="mode" data-mode="scramble">
          <span class="mode-name">🔤 Susun Huruf</span>
          <span class="mode-desc">Susun huruf jadi nama gambarnya.</span>
          <span class="mode-best">Bintang terbanyak: <b id="best-scramble">0</b></span>
        </button>
        <button class="mode" data-mode="match">
          <span class="mode-name">🃏 Cari Pasangan</span>
          <span class="mode-desc">Buka kartu, cocokkan gambar dan namanya.</span>
          <span class="mode-best">Bintang terbanyak: <b id="best-match">0</b></span>
        </button>
      </div>
    </section>

    <!-- GAME: tebak gambar dan susun huruf -->
    <section id="game" class="screen">
      <div class="hud">
        <div class="hud-item">Bintang <b id="score">0</b></div>
        <div class="hud-item">Soal <b id="round">1/10</b></div>
        <div class="hud-item" id="lives" aria-label="Nyawa"></div>
        <div class="hud-item streak" id="streak-wrap" hidden>Beruntun <b id="streak">0</b></div>
      </div>
      <div class="timer"><div id="timer-bar"></div></div>

      <div class="question">
        <div class="picture" id="picture"></div>
        <div class="question-text">
          <p id="prompt" class="prompt"></p>
          <div class="word-row">
            <h2 id="word" class="word"></h2>
            <button id="speak" class="speak" aria-label="Dengarkan ucapannya">🔊 Dengar</button>
          </div>
        </div>
        <div class="mascot-slot small" id="game-mascot" data-mascot></div>
      </div>

      <div id="answer-area"></div>
      <p id="feedback" class="feedback" role="status"></p>
    </section>

    <!-- GAME: cari pasangan -->
    <section id="match" class="screen">
      <div class="hud">
        <div class="hud-item">Langkah <b id="moves">0</b></div>
        <div class="hud-item">Pasangan <b id="found">0/6</b></div>
        <button id="match-quit" class="btn btn-small">Kembali</button>
      </div>
      <div class="cards" id="cards"></div>
      <p id="match-feedback" class="feedback" role="status"></p>
    </section>

    <!-- HASIL -->
    <section id="result" class="screen">
      <div class="mascot-slot big" id="result-mascot" data-mascot></div>
      <h2 class="result-title" id="result-title"></h2>
      <p class="stars" id="stars" aria-hidden="true"></p>
      <p class="result-score"><b id="final-score">0</b> bintang</p>
      <p id="result-note" class="lead"></p>
      <div id="review" class="review"></div>
      <div class="result-actions">
        <button id="again" class="btn btn-main">Main lagi</button>
        <button id="home" class="btn">Ganti permainan</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
